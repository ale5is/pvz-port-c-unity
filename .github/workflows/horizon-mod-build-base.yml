name: Prepare Horizon 0.7.8 native-mod build cache

on:
  workflow_dispatch:
  push:
    branches:
      - port/horizon-078-hooks-359
    paths:
      - "native-build/run-base-cache.once"

permissions:
  contents: read

jobs:
  base:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      MOD_BUILD_BASE_OVERRIDE: "1"
      MOD_BUILD_SECONDS_OVERRIDE: "14000"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate native build scripts and bundle decoder
        run: |
          bash -n native-build/scripts/*.sh
          python3 -m py_compile native-build/scripts/*.py native-build/gateway/*.py
          python3 native-build/scripts/test_bundle.py
          python3 native-build/scripts/test_build_layout.py
      - name: Prepare pinned Horizon source and built-in SVC mod
        run: bash native-build/scripts/prepare.sh 0.7.8
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Rust, Android NDK and horizon-mixins
        run: bash native-build/scripts/tools.sh
      - name: Free temporary runner disk space
        run: bash native-build/scripts/room.sh
      - name: Build trusted Horizon + Simple Voice Chat base
        run: |
          commit=$(cat "$HOME/modbuild/HORIZON_COMMIT")
          job="$HOME/modbuild/jobs/base"
          mkdir -p "$job/mods" "$job/out"
          python3 native-build/scripts/create_smoke_request.py "$RUNNER_TEMP/horizon-native-smoke.bin"
          PYTHONPATH=native-build/scripts python3 - "$RUNNER_TEMP/horizon-native-smoke.bin" "$job/mods" <<'PY'
          import json, pathlib, sys
          from mod_build_server import check_compatibility, unpack_request
          versions = json.loads(pathlib.Path("native-build/versions.json").read_text())
          manifests = unpack_request(pathlib.Path(sys.argv[1]).read_bytes(), pathlib.Path(sys.argv[2]))
          check_compatibility(manifests, versions["0.7.8"])
          PY
          bash native-build/scripts/mod_build_sandbox.sh "$HOME/modbuild" "$commit" "$job"
      - name: Save reusable clean build cache
        uses: actions/cache/save@v4
        with:
          path: |
            /home/runner/.rustup
            /home/runner/modbuild/cargo
            /home/runner/modbuild/base
            /usr/local/lib/android/sdk/ndk/27.2.12479018
          key: horizon-078-native-base-arm64-v1
