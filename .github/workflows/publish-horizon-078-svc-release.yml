name: Publish PavoHorizon 0.7.8 SVC release

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-pavohorizon-078-svc
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Find successful APK build for this exact commit
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build-horizon-078-svc-jade.yml/runs?branch=main&status=success&per_page=50" --jq '[.workflow_runs[] | select(.head_sha == env.GITHUB_SHA) | .id][0] // empty')"
          test -n "$RUN_ID" || { echo "No successful PavoHorizon APK build exists for commit $GITHUB_SHA"; exit 1; }
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download verified PavoHorizon artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/artifact"
          gh run download "${{ steps.build.outputs.run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --name PavoHorizon-0.7.8-SVC-Jade-arm64-v8a \
            --dir "$RUNNER_TEMP/artifact"
          test -s "$RUNNER_TEMP/artifact/PavoHorizon-0.7.8-SVC-Jade-arm64-v8a.apk"
          test -s "$RUNNER_TEMP/artifact/SHA256SUMS.txt"
          test -s "$RUNNER_TEMP/artifact/BUILD-INFO.txt"

      - name: Verify checksum and source commit
        run: |
          cd "$RUNNER_TEMP/artifact"
          sha256sum --check SHA256SUMS.txt
          grep -F "Built from commit: $GITHUB_SHA" BUILD-INFO.txt

      - name: Publish commit-specific GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/artifact"
          TAG="v0.7.8-svc-android-${GITHUB_SHA:0:7}"
          gh release create "$TAG" \
            PavoHorizon-0.7.8-SVC-Jade-arm64-v8a.apk SHA256SUMS.txt BUILD-INFO.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PavoHorizon 0.7.8 + Simple Voice Chat + Jade (Android ARM64)" \
            --prerelease \
            --notes "Built from commit $GITHUB_SHA. Includes the Horizon 0.7.8 Android port, Simple Voice Chat and the initial Jade block tooltip adaptation. The workflow verifies the APK checksum and build source commit. Physical-device installation, microphone permission and end-to-end voice behavior still require testing; CI success alone does not establish runtime compatibility."
