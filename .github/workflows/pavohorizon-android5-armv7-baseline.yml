name: PavoHorizon Android 5 ARMv7 baseline

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pavo-android5-armv7-baseline
  cancel-in-progress: true

jobs:
  armv7-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      STARLING_REV: 0e5bb58a44efa8e38ee067172a11e3c573829976
      ABI: armeabi-v7a
      RUST_TARGET: armv7-linux-androideabi
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install Android SDK and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "build-tools;35.0.0" "platforms;android-36" "ndk;28.2.13676358" > /dev/null

      - name: Fetch the pinned Starling ARM32 base
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/starling-client/starling.git "$RUNNER_TEMP/starling"
          git -C "$RUNNER_TEMP/starling" checkout --detach "$STARLING_REV"
          test "$(git -C "$RUNNER_TEMP/starling" rev-parse HEAD)" = "$STARLING_REV"

      - name: Install Rust ARMv7 toolchain
        working-directory: ${{ runner.temp }}/starling
        run: |
          bash tools/ci/rustup_install.sh --profile minimal --component rust-src --target "$RUST_TARGET"
          cargo install cargo-ndk --version 3.5.4 --locked
          rustc --version
          cargo ndk --version

      - name: Brand the isolated APK as PavoHorizon Android 5
        working-directory: ${{ runner.temp }}/starling
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("packaging/android/build_apk.py")
          source = path.read_text()
          replacements = {
              'APPLICATION_ID = "io.github.juanluci.starling"':
                  'APPLICATION_ID = "dev.pavo.horizonandroid5"',
              'LABEL = "Starling"': 'LABEL = "PavoHorizon Android 5"',
          }
          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise SystemExit(f"Expected exactly one branding token: {old}")
              source = source.replace(old, new)
          path.write_text(source)
          PY

      - name: Build the ARMv7 reference APK (API 26 baseline only)
        working-directory: ${{ runner.temp }}/starling
        env:
          HORIZON_ANDROID_KEY_ALIAS: horizon-debug
          HORIZON_ANDROID_STORE_PASSWORD: android
          HORIZON_ANDROID_KEY_PASSWORD: android
        run: |
          set -euo pipefail
          python3 packaging/android/build_apk.py --abi "$ABI" --profile quick --dev
          apk=$(find target/android -maxdepth 1 -type f -name '*armeabi-v7a.apk' -print -quit)
          test -n "$apk"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$apk" "$GITHUB_WORKSPACE/dist/PavoHorizon-ARMv7-API26-baseline.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$GITHUB_WORKSPACE/dist/PavoHorizon-ARMv7-API26-baseline.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$GITHUB_WORKSPACE/dist/PavoHorizon-ARMv7-API26-baseline.apk" > "$GITHUB_WORKSPACE/dist/badging.txt"
          grep -F "dev.pavo.horizonandroid5.dev" "$GITHUB_WORKSPACE/dist/badging.txt"
          grep -F "armeabi-v7a" "$GITHUB_WORKSPACE/dist/badging.txt"
          printf 'Starling revision: %s\nABI: %s\nRust target: %s\nMinimum Android API: 26 (baseline; not Android 5 compatible)\n' \
            "$STARLING_REV" "$ABI" "$RUST_TARGET" > "$GITHUB_WORKSPACE/dist/BUILD.txt"
          sha256sum "$GITHUB_WORKSPACE/dist/PavoHorizon-ARMv7-API26-baseline.apk" > "$GITHUB_WORKSPACE/dist/SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: pavohorizon-armv7-api26-baseline
          path: dist/
          if-no-files-found: error
          retention-days: 30
