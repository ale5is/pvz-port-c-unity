name: PavoHorizonNightly - Simple Voice Chat native API compatibility

on:
  push:
    branches:
      - pavohorizonnightly
    paths:
      - "mod/simple-voice-chat/**"
      - ".github/workflows/nightly-svc-compatibility.yml"
  pull_request:
    paths:
      - "mod/simple-voice-chat/**"
      - ".github/workflows/nightly-svc-compatibility.yml"

permissions:
  contents: read

concurrency:
  group: pavohorizonnightly-svc-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-api:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HORIZON_REV: 85b5bcca7c79bb470b90bdb5914b413aa66fe7ae
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.95.0

      - name: Fetch the exact Horizon Nightly SDK source
        run: |
          git init "$RUNNER_TEMP/horizon-nightly"
          git -C "$RUNNER_TEMP/horizon-nightly" remote add origin https://github.com/horizon-rust/horizon.git
          git -C "$RUNNER_TEMP/horizon-nightly" fetch --depth=1 origin "$HORIZON_REV"
          git -C "$RUNNER_TEMP/horizon-nightly" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/horizon-nightly" rev-parse HEAD)" = "$HORIZON_REV"

      - name: Attach the pinned API source to the native mod package
        run: |
          mkdir -p mod/simple-voice-chat/native/.horizon/sdk/api
          cp -a "$RUNNER_TEMP/horizon-nightly/." mod/simple-voice-chat/native/.horizon/sdk/api/
          test -f mod/simple-voice-chat/native/.horizon/sdk/api/Cargo.toml
          test -f mod/simple-voice-chat/native/.horizon/sdk/api/crates/horizon-mod-api/Cargo.toml

      - name: Check the native adapter against the pinned Nightly API
        run: |
          cargo check --manifest-path mod/simple-voice-chat/native/Cargo.toml
          cargo test --manifest-path mod/simple-voice-chat/native/Cargo.toml
