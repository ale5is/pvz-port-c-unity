name: PavoHorizon Android 5 API-22 diagnostic

on:
  push:
    branches:
      - port/android-5-low-end
    paths:
      - 'tools/android5_patch.py'
      - 'patches/horizon-078/gles2-native-build.py'
      - 'tools/check_android5_native_gles2_link.py'
      - 'tools/gles2-hud-prototype/app/src/main/cpp/horizon_gles2_bridge.*'
      - 'tools/check_android5_renderer_boundary.py'
      - 'patches/horizon-078/gles2-hud-adapter.py'
      - 'patches/horizon-078/renderer-hud-boundary.py'
      - 'patches/horizon-078/renderer-gles2-event-thread.py'
      - 'tools/check_android5_event_thread_renderer.py'
      - 'patches/horizon-078/renderer-frame-contract.py'
      - 'patches/horizon-078/renderer-frame-inputs.py'
      - 'patches/horizon-078/renderer-types-crate.py'
      - 'patches/horizon-078/renderer-backend-api.py'
      - 'tools/check_android5_backend_api.py'
      - 'tools/check_android5_render_types_crate.py'
      - 'tools/check_android5_frame_contract.py'
      - 'tools/check_android5_renderer_ownership.py'
      - 'tools/check_android5_game_loop.py'
      - 'tools/check_android5_backend_selection.py'
      - 'tools/check_android5_renderer_callsite_inventory.py'
      - 'tools/check_android5_egl_lifecycle.py'
      - 'patches/horizon-078/ANDROID5-EGL-LIFECYCLE-CONTRACT.md'
      - 'patches/horizon-078/gles2-terrain-adapter.py'
      - 'patches/horizon-078/gles2-terrain.vert'
      - 'patches/horizon-078/gles2-terrain-solid.frag'
      - 'patches/horizon-078/gles2-terrain-translucent.frag'
      - 'tools/check_gles2_terrain_shaders.py'
      - 'tools/check_gles2_terrain_renderer.py'
      - 'tools/check_gles2_embedded_shaders.py'
      - 'tools/gles2-hud-prototype/app/src/main/cpp/**'
      - '.github/workflows/pavohorizon-078-android22-diagnostic.yml'
  workflow_dispatch:
    inputs:
      build_diagnostic_apk:
        description: Build the diagnostic APK (not playable)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pavo-horizon-078-android22-diagnostic
  cancel-in-progress: true

jobs:
  armv7-api22:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      HORIZON_REV: 68a2c4dd1b9a9e511ad3758a79ab772b6f9e5b29
      ABI: armeabi-v7a
      RUST_TARGET: armv7-linux-androideabi
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Install Android SDK and NDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)
          fi
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"

      - name: Configure Android NDK compiler for Rust ARMv7
        run: |
          set -euo pipefail
          toolchain="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$toolchain/armv7a-linux-androideabi22-clang"
          test -x "$toolchain/llvm-ar"
          {
            echo "CC_armv7_linux_androideabi=$toolchain/armv7a-linux-androideabi22-clang"
            echo "CXX_armv7_linux_androideabi=$toolchain/armv7a-linux-androideabi22-clang++"
            echo "AR_armv7_linux_androideabi=$toolchain/llvm-ar"
            echo "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=$toolchain/armv7a-linux-androideabi22-clang"
          } >> "$GITHUB_ENV"

      - name: Fetch exact Horizon Android 0.7.8 source
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/starling-client/starling.git "$RUNNER_TEMP/horizon-078"
          git -C "$RUNNER_TEMP/horizon-078" checkout --detach "$HORIZON_REV"
          test "$(git -C "$RUNNER_TEMP/horizon-078" rev-parse HEAD)" = "$HORIZON_REV"

      - name: Verify Horizon GLES2 renderer integration boundary
        run: python3 tools/check_android5_renderer_boundary.py "$RUNNER_TEMP/horizon-078"

      - name: Verify Horizon game-loop upload and Android lifecycle contract
        run: python3 tools/check_android5_game_loop.py "$RUNNER_TEMP/horizon-078"

      - name: Verify wgpu GL is not mistaken for the native GLES2 backend
        run: python3 tools/check_android5_backend_selection.py "$RUNNER_TEMP/horizon-078"

      - name: Verify Android renderer construction and call-site inventory
        run: python3 tools/check_android5_renderer_callsite_inventory.py "$RUNNER_TEMP/horizon-078"

      - name: Verify Android EGL lifecycle ownership assumptions
        run: python3 tools/check_android5_egl_lifecycle.py "$RUNNER_TEMP/horizon-078"

      - name: Apply limited Android 5 diagnostic patch
        run: python3 tools/android5_patch.py "$RUNNER_TEMP/horizon-078"

      - name: Link reusable GLES2 backend into Horizon Android cdylib
        run: python3 patches/horizon-078/gles2-native-build.py "$RUNNER_TEMP/horizon-078"

      - name: Verify Android GLES2 native library linkage
        run: python3 tools/check_android5_native_gles2_link.py "$RUNNER_TEMP/horizon-078"

      - name: Install Horizon HUD GLES2 CPU adapter
        run: python3 patches/horizon-078/gles2-hud-adapter.py "$RUNNER_TEMP/horizon-078"

      - name: Install Horizon terrain GLES2 CPU adapter
        run: python3 patches/horizon-078/gles2-terrain-adapter.py "$RUNNER_TEMP/horizon-078"

      - name: Encapsulate renderer HUD backend setup
        run: python3 patches/horizon-078/renderer-hud-boundary.py "$RUNNER_TEMP/horizon-078"

      - name: Separate GLES CPU preparation from event-thread renderer creation
        run: python3 patches/horizon-078/renderer-gles2-event-thread.py "$RUNNER_TEMP/horizon-078"

      - name: Separate the CPU frame contract from wgpu
        run: python3 patches/horizon-078/renderer-frame-contract.py "$RUNNER_TEMP/horizon-078"

      - name: Move CPU render inputs out of wgpu implementation modules
        run: |
          python3 patches/horizon-078/renderer-frame-inputs.py "$RUNNER_TEMP/horizon-078"
          python3 tools/check_android5_frame_contract.py "$RUNNER_TEMP/horizon-078"

      - name: Extract GPU-independent vertex formats
        run: |
          python3 patches/horizon-078/renderer-types-crate.py "$RUNNER_TEMP/horizon-078"
          python3 tools/check_android5_render_types_crate.py "$RUNNER_TEMP/horizon-078"

      - name: Install backend-neutral frame and lifecycle API
        run: |
          python3 patches/horizon-078/renderer-backend-api.py "$RUNNER_TEMP/horizon-078"
          python3 tools/check_android5_backend_api.py "$RUNNER_TEMP/horizon-078"

      - name: Test standalone renderer backend API
        working-directory: ${{ runner.temp }}/horizon-078
        run: cargo test -p horizon-render-api

      - name: Audit the crate-level renderer backend boundary
        run: python3 tools/check_android5_render_crate_boundary.py "$RUNNER_TEMP/horizon-078"

      - name: Audit remaining renderer GPU ownership references
        run: python3 tools/check_android5_renderer_ownership.py "$RUNNER_TEMP/horizon-078"

      - name: Configure native GLES2 prototype for Android 5 ARMv7
        run: |
          set -euo pipefail
          cmake -S tools/gles2-hud-prototype/app/src/main/cpp \
            -B "$RUNNER_TEMP/pavo-gles2-native-build" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/28.2.13676358/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-22 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/pavo-gles2-native-build" --parallel 2

      - name: Install Rust ARMv7 target
        working-directory: ${{ runner.temp }}/horizon-078
        run: |
          rustup show
          rustup target add "$RUST_TARGET"
          rustc --version
          cargo --version

      - name: Test independent render data crate
        working-directory: ${{ runner.temp }}/horizon-078
        run: cargo test -p horizon-render-types

      - name: Test Horizon mobile atlas fitting
        working-directory: ${{ runner.temp }}/horizon-078
        run: cargo test -p horizon-client-render --lib mobile_atlas

      - name: Test Horizon GLES2 HUD CPU adapter
        working-directory: ${{ runner.temp }}/horizon-078
        run: cargo test -p horizon-client-render --lib gles2_hud::tests

      - name: Install GLSL ES compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools

      - name: Compile GLES2 terrain shaders as GLSL ES 1.00
        run: |
          set -euo pipefail
          glslangValidator -S vert patches/horizon-078/gles2-terrain.vert
          glslangValidator -S frag patches/horizon-078/gles2-terrain-solid.frag
          glslangValidator -S frag patches/horizon-078/gles2-terrain-translucent.frag

      - name: Check GLES2 terrain shader contract
        run: python3 tools/check_gles2_terrain_shaders.py

      - name: Compile exact shaders embedded in native GLES2 renderer
        run: python3 tools/check_gles2_embedded_shaders.py tools/gles2-hud-prototype/app/src/main/cpp/gles2_terrain_renderer.cpp "$(command -v glslangValidator)"

      - name: Check native GLES2 renderer ABI and emission path
        run: python3 tools/check_gles2_terrain_renderer.py tools/gles2-hud-prototype/app/src/main/cpp

      - name: Test Horizon GLES2 terrain CPU adapter
        working-directory: ${{ runner.temp }}/horizon-078
        run: cargo test -p horizon-client-render --lib gles2_terrain::tests

      - name: Cross-check the patched Horizon client for Android 5 ARMv7
        working-directory: ${{ runner.temp }}/horizon-078
        run: |
          set -euo pipefail
          cargo check --target "$RUST_TARGET" -p horizon-client --lib --no-default-features --features winit/android-native-activity

      - name: Compile the Android cdylib and linked native GLES2 EGL backend
        working-directory: ${{ runner.temp }}/horizon-078
        run: |
          set -euo pipefail
          cargo check --target "$RUST_TARGET" -p horizon-android --lib --no-default-features

      - name: Pin Mojang manifest to the Horizon lock
        if: github.event_name == 'workflow_dispatch' && inputs.build_diagnostic_apk
        working-directory: ${{ runner.temp }}/horizon-078
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path.cwd()
          game = json.loads((root / "research-lock.json").read_text())["minecraft"]
          version, sha1 = game["version"], game["manifest_sha1"]
          url = f"https://piston-meta.mojang.com/v1/packages/{sha1}/{version}.json"
          script = root / "tools/android_prepare.py"
          source = script.read_text()
          old = "entry = next((v for v in fetch_json(MANIFEST)['versions'] if v['id'] == version), None)"
          new = f"entry = {{'url': {url!r}, 'sha1': {sha1!r}}}"
          if source.count(old) != 1:
              raise SystemExit("Could not uniquely locate pinned manifest lookup")
          script.write_text(source.replace(old, new))
          print(f"Using Horizon-pinned Mojang manifest: {url}")
          PY

      - name: Prepare official game tables and resources
        if: github.event_name == 'workflow_dispatch' && inputs.build_diagnostic_apk
        working-directory: ${{ runner.temp }}/horizon-078
        run: python3 tools/android_prepare.py --java-home "$JAVA_HOME"

      - name: Build API-22 ARMv7 diagnostic APK
        if: github.event_name == 'workflow_dispatch' && inputs.build_diagnostic_apk
        working-directory: ${{ runner.temp }}/horizon-078
        run: |
          set -euo pipefail
          test -x "$JAVA_HOME_17_X64/bin/java"
          python3 tools/android_build.py \
            --abi "$ABI" \
            --public \
            --profile release \
            --sdk "$ANDROID_HOME" \
            --java-home "$JAVA_HOME_17_X64" \
            --gradle "$(command -v gradle)" \
            --ndk-version 28.2.13676358 \
            --build-tools-version 35.0.0 \
            --dev-build "android5-api22-diagnostic-${GITHUB_RUN_NUMBER}" \
            --dev-version-code "$((200000 + GITHUB_RUN_NUMBER))"

          apk="$RUNNER_TEMP/horizon-078/.local/android/apk/$ABI/horizon-android-public.apk"
          test -s "$apk"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$apk" "$GITHUB_WORKSPACE/dist/PavoHorizon-0.7.8-ARMv7-API22-diagnostic.apk"

          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/apksigner" verify "$GITHUB_WORKSPACE/dist/PavoHorizon-0.7.8-ARMv7-API22-diagnostic.apk"
          "$tools/aapt" dump badging "$GITHUB_WORKSPACE/dist/PavoHorizon-0.7.8-ARMv7-API22-diagnostic.apk" > "$GITHUB_WORKSPACE/dist/badging.txt"
          grep -F "armeabi-v7a" "$GITHUB_WORKSPACE/dist/badging.txt"
          grep -F "sdkVersion:'22'" "$GITHUB_WORKSPACE/dist/badging.txt"

          printf 'Horizon Android 0.7.8 commit: %s\nABI: %s\nRust target: %s\nMinimum Android API: 22\nPurpose: install/launch diagnostic only; GLES2 rendering and audio are not implemented in this build.\n' \
            "$HORIZON_REV" "$ABI" "$RUST_TARGET" > "$GITHUB_WORKSPACE/dist/BUILD.txt"
          sha256sum "$GITHUB_WORKSPACE/dist/PavoHorizon-0.7.8-ARMv7-API22-diagnostic.apk" > "$GITHUB_WORKSPACE/dist/SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.build_diagnostic_apk
        with:
          name: pavohorizon-078-armv7-api22-diagnostic
          path: dist/
          if-no-files-found: error
          retention-days: 30
