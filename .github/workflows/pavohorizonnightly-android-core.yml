name: PavoHorizonNightly Android core and APK

on:
  push:
    branches: [pavohorizonnightly]
    paths:
      - "tools/pavohorizonnightly/android_bootstrap.py"
      - "tools/pavohorizonnightly/AndroidManifest.xml"
      - "tools/pavohorizonnightly/HorizonActivity.java"
      - "tools/pavohorizonnightly/minecraft-26.3-lock.json"
      - "tools/pavohorizonnightly/verify_minecraft_lock.py"
      - ".gitmodules"
      - "upstream/horizon-078"
      - ".github/workflows/pavohorizonnightly-android-core.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pavohorizonnightly-android-core
  cancel-in-progress: true

jobs:
  android-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      HORIZON_REV: 85b5bcca7c79bb470b90bdb5914b413aa66fe7ae
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify original Horizon Android 0.7.8 launcher base
        shell: bash
        run: |
          set -euo pipefail
          base=upstream/horizon-078
          expected=68a2c4dd1b9a9e511ad3758a79ab772b6f9e5b29
          test "$(git -C "$base" rev-parse HEAD)" = "$expected"
          files=(
            "crates/horizon-client/src/android_main.rs"
            "crates/horizon-client/src/android/launcher.rs"
            "crates/horizon-client/src/android/game_launch.rs"
            "crates/horizon-client/src/official_install.rs"
          )
          for file in "${files[@]}"; do
            test -s "$base/$file"
            sha256sum "$base/$file"
          done
          printf 'Android source files: '
          find "$base/crates/horizon-client/src/android" -maxdepth 1 -type f | wc -l
          printf 'Pinned launcher base: %s\n' "$(git -C "$base" rev-parse --short HEAD)"
          test -s sources/simple-voice-chat/README.md
          test -s sources/simple-voice-chat/compatibility.json
          test -s mod/simple-voice-chat/crates/svc_client/src/lib.rs
          grep -F 'Target Horizon revision: `68a2c4dd1b9a9e511ad3758a79ab772b6f9e5b29`' mod/simple-voice-chat/README.md
          grep -F 'horizon_revision = "68a2c4dd1b9a9e511ad3758a79ab772b6f9e5b29"' mod/simple-voice-chat/horizon-mixin.toml
          grep -F 'horizon = "85b5bcca7c79bb470b90bdb5914b413aa66fe7ae"' mod/simple-voice-chat/native/horizon-mod.toml
          grep -F 'horizon_revision = "68a2c4dd1b9a9e511ad3758a79ab772b6f9e5b29"' mod/simple-voice-chat/horizon-mixin.toml
          python3 - <<'PY'
          import json
          from pathlib import Path
          meta = json.loads(Path("sources/simple-voice-chat/compatibility.json").read_text())
          assert meta["game"] == "26.3"
          assert meta["hooks"] == 359
          print("Simple Voice Chat source metadata:", meta["game"], "hooks", meta["hooks"], "revision", meta["horizon_revision"])
          PY
          echo 'Simple Voice Chat source exists; Android audio and launcher integration remains a separate porting task.'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Verify pinned Minecraft 26.3 metadata against Mojang
        run: python3 tools/pavohorizonnightly/verify_minecraft_lock.py --network

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdk" --licenses > /dev/null || true
          for attempt in 1 2 3; do
            if "$sdk" --install "platforms;android-36" "build-tools;35.0.0" "ndk;28.2.13676358"; then
              exit 0
            fi
            rm -rf "$ANDROID_HOME/.temp" "$ANDROID_HOME/ndk/28.2.13676358"
            sleep 10
          done
          exit 1

      - name: Install Rust ARM64 toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal --target aarch64-linux-android
          rustup default 1.97.0
          cargo install cargo-ndk --version 3.5.4 --locked

      - name: Fetch exact Horizon Nightly source
        run: |
          git clone --filter=blob:none https://github.com/horizon-rust/horizon.git horizon
          git -C horizon checkout --detach "$HORIZON_REV"
          test "$(git -C horizon rev-parse HEAD)" = "$HORIZON_REV"

      - name: Fetch Android build dependencies for the Winit input hook
        run: cargo fetch --manifest-path horizon/Cargo.toml --target aarch64-linux-android

      - name: Inject NativeActivity bootstrap
        run: |
          python3 tools/pavohorizonnightly/android_bootstrap.py "$GITHUB_WORKSPACE/horizon"
          git -C horizon diff --check
          git -C horizon diff --stat

      - name: Compile Android client library
        run: |
          set -o pipefail
          cd horizon
          cargo ndk -t arm64-v8a --platform 26 check \
            -p horizon-android --no-default-features 2>&1 | tee ../android-core-check.log

      - name: Build Android shared library
        run: |
          set -o pipefail
          cd horizon
          cargo ndk -t arm64-v8a --platform 26 build \
            -p horizon-android --no-default-features --release 2>&1 | tee ../android-native-build.log
          test -s target/aarch64-linux-android/release/libhorizon_android.so
          file target/aarch64-linux-android/release/libhorizon_android.so

      - name: Compile Android activity from the base port
        shell: bash
        run: |
          set -euo pipefail
          bt="$ANDROID_HOME/build-tools/35.0.0"
          android_jar="$ANDROID_HOME/platforms/android-36/android.jar"
          mkdir -p dist/activity-classes dist/apk
          javac -source 8 -target 8 -classpath "$android_jar" \
            -d dist/activity-classes tools/pavohorizonnightly/HorizonActivity.java
          "$bt/d8" --lib "$android_jar" --output dist/apk dist/activity-classes/dev/pavo/horizonnightly/HorizonActivity.class
          test -s dist/apk/classes.dex

      - name: Package signed ARM64 APK
        shell: bash
        env:
          PAVO_ANDROID_KEYSTORE_BASE64: ${{ secrets.PAVO_ANDROID_KEYSTORE_BASE64 }}
          PAVO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.PAVO_ANDROID_KEYSTORE_PASSWORD }}
          PAVO_ANDROID_KEY_ALIAS: ${{ secrets.PAVO_ANDROID_KEY_ALIAS }}
          PAVO_ANDROID_KEY_PASSWORD: ${{ secrets.PAVO_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          bt="$ANDROID_HOME/build-tools/35.0.0"
          android_jar="$ANDROID_HOME/platforms/android-36/android.jar"
          out="$GITHUB_WORKSPACE/dist"
          mkdir -p "$out/apk/lib/arm64-v8a"
          cp horizon/target/aarch64-linux-android/release/libhorizon_android.so "$out/apk/lib/arm64-v8a/"
          "$bt/aapt2" link -o "$out/base.apk" \
            --manifest tools/pavohorizonnightly/AndroidManifest.xml \
            -I "$android_jar" --min-sdk-version 26 --target-sdk-version 35 \
            --version-code 1 --version-name "0.1.0-nightly"
          cp "$out/base.apk" "$out/unsigned.apk"
          (cd "$out/apk" && zip -q -r "$out/unsigned.apk" lib classes.dex)
          "$bt/zipalign" -P 16 -f 4 "$out/unsigned.apk" "$out/aligned.apk"
          key="$RUNNER_TEMP/pavohorizonnightly.keystore"
          if [[ -n "${PAVO_ANDROID_KEYSTORE_BASE64:-}" ]]; then
            : "${PAVO_ANDROID_KEYSTORE_PASSWORD:?Falta PAVO_ANDROID_KEYSTORE_PASSWORD}"
            : "${PAVO_ANDROID_KEY_ALIAS:?Falta PAVO_ANDROID_KEY_ALIAS}"
            : "${PAVO_ANDROID_KEY_PASSWORD:?Falta PAVO_ANDROID_KEY_PASSWORD}"
            printf '%s' "$PAVO_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key"
            storepass="$PAVO_ANDROID_KEYSTORE_PASSWORD"
            keypass="$PAVO_ANDROID_KEY_PASSWORD"
            keyalias="$PAVO_ANDROID_KEY_ALIAS"
          else
            keytool -genkeypair -keystore "$key" -storepass android -keypass android \
              -alias pavohorizonnightly -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=PavoHorizonNightly" -noprompt
            storepass="android"
            keypass="android"
            keyalias="pavohorizonnightly"
            echo "::warning::Se usó una clave temporal. Las próximas APK no podrán instalarse como actualización sin desinstalar la anterior."
          fi
          "$bt/apksigner" sign --ks "$key" --ks-pass "pass:$storepass" \
            --key-pass "pass:$keypass" --ks-key-alias "$keyalias" \
            --out "$out/PavoHorizonNightly.apk" "$out/aligned.apk"
          "$bt/apksigner" verify --verbose "$out/PavoHorizonNightly.apk"
          "$bt/aapt" dump badging "$out/PavoHorizonNightly.apk" | tee "$out/badging.txt"
          if grep -F "application-debuggable" "$out/badging.txt"; then
            echo "La APK no debe estar marcada como debuggable" >&2
            exit 1
          fi
          "$bt/aapt" dump permissions "$out/PavoHorizonNightly.apk" | tee "$out/permissions.txt"
          grep -F "package: name='dev.pavo.horizonnightly'" "$out/badging.txt"
          grep -F "PavoHorizonNightly" "$out/badging.txt"
          grep -F "launchable-activity: name='dev.pavo.horizonnightly.HorizonActivity'" "$out/badging.txt"
          unzip -l "$out/PavoHorizonNightly.apk" | grep -F "classes.dex"
          sha256sum "$out/PavoHorizonNightly.apk" | tee "$out/SHA256SUMS.txt"
          ls -lh "$out/PavoHorizonNightly.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pavohorizonnightly-arm64-apk
          path: |
            dist/PavoHorizonNightly.apk
            dist/SHA256SUMS.txt
            dist/badging.txt
            dist/permissions.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android core diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pavohorizonnightly-android-core-diagnostics
          path: |
            android-core-check.log
            android-native-build.log
          if-no-files-found: ignore
          retention-days: 14
