name: Build Horizon 0.7.8 SVC + Jade Android APK

on:
  push:
    branches: [main, fix/pavohorizon-svc-launcher-settings, port/atlas-api80-core, port/starling-090-performance]
    paths:
      - ".github/workflows/build-horizon-078-svc-jade.yml"
      - "scripts/build_android_port.py"
      - "scripts/check_atlas_api80.py"
      - "scripts/patch_bundled_native_mods.py"
      - "scripts/patch_starling_090_performance.py"
      - "PAVO_VERSION"
      - "mod/**"
      - "mod/atlas-upstream/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: horizon-078-svc-jade-android
  cancel-in-progress: false

jobs:
  build-arm64-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout Pavo port (${{ github.ref }})
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Checkout pinned Horizon 0.7.8 source
        uses: actions/checkout@v4
        with:
          repository: starling-client/starling
          ref: 68a2c4dd1b9a9e511ad3758a79ab772b6f9e5b29
          path: horizon-source

      - name: Install Rust 1.95.0 and Android target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: aarch64-linux-android

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JDK 17 for Android packaging
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Expose installed Gradle to Horizon build
        shell: bash
        run: |
          GRADLE_BIN="$(find "$RUNNER_TEMP/.gradle-actions/gradle-installations/installs" -type f -path '*/bin/gradle' -print -quit)"
          test -n "$GRADLE_BIN"
          echo "$(dirname "$GRADLE_BIN")" >> "$GITHUB_PATH"
          echo "GRADLE_BIN=$GRADLE_BIN" >> "$GITHUB_ENV"
          "$GRADLE_BIN" --version

      - name: Install Android SDK, NDK and build tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept licenses and install pinned Android toolchain
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "ndk;28.2.13676358" "build-tools;35.0.0" "platforms;android-36"

      - name: Seed Horizon with Mojang's exact pinned 26.3 manifest
        run: |
          mkdir -p horizon-source/.local/minecraft/26.3
          curl --fail --location --retry 5 \
            https://piston-meta.mojang.com/v1/packages/11f1aefe473eefba0af62e3286c33b692807b2eb/26.3.json \
            --output horizon-source/.local/minecraft/26.3/manifest.json
          echo "11f1aefe473eefba0af62e3286c33b692807b2eb  horizon-source/.local/minecraft/26.3/manifest.json" | sha1sum --check

      - name: Prepare pinned Minecraft 26.3 engine tables
        run: python horizon-source/tools/android_prepare.py

      - name: Port Starling 0.9.0 Android menu frame cap without replacing the renderer
        run: python scripts/patch_starling_090_performance.py horizon-source

      - name: Audit Atlas source against Horizon 0.7.8 hooks API 80
        run: python scripts/check_atlas_api80.py

      - name: Register Jade and Simple Voice Chat as built-in Android mods
        run: |
          python scripts/patch_bundled_native_mods.py horizon-source

      - name: Read Pavo version and set monotonic Android version code
        id: pavo-version
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n' < PAVO_VERSION)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))
          echo "pavo_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "pavo_version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "ORG_GRADLE_PROJECT_pavoVersionName=$VERSION" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_pavoVersionCode=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "PavoHorizon version=$VERSION versionCode=$VERSION_CODE"

      - name: Run Horizon Atlas core logic tests
        run: cargo test --manifest-path mod/atlas-upstream/Cargo.toml

      - name: Require persistent signing key for updateable APKs
        env:
          PAVO_ANDROID_KEYSTORE_BASE64: ${{ secrets.PAVO_ANDROID_KEYSTORE_BASE64 || secrets.PAVO_ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$PAVO_ANDROID_KEYSTORE_BASE64" || {
            echo "Missing PAVO_ANDROID_KEYSTORE_BASE64 repository secret. See docs/ANDROID_UPDATES.md."
            exit 1
          }

      - name: Validate Jade Rust syntax before mixin packaging
        run: |
          rustfmt --edition 2024 --emit stdout mod/jade.rs > /dev/null

      - name: Apply API-80 SVC and Jade bundles and build public ARM64 APK
        env:
          PAVO_ANDROID_KEYSTORE_BASE64: ${{ secrets.PAVO_ANDROID_KEYSTORE_BASE64 || secrets.PAVO_ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          python scripts/build_android_port.py \
            --horizon-source horizon-source \
            --abi arm64-v8a \
            --sdk "$ANDROID_HOME" \
            --java-home "$JAVA_HOME" \
            --gradle "$GRADLE_BIN" \
            --ndk-version 28.2.13676358 \
            --build-tools-version 35.0.0 \
            --profile release \
            --public \
            --trust-native-code

      - name: Verify APK package identity and version metadata
        shell: bash
        run: |
          APK=".build/horizon-078-android/.local/android/apk/arm64-v8a/horizon-android-public.apk"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          EXPECTED="package: name='com.ale5is.pavohorizon' versionCode='${{ steps.pavo-version.outputs.pavo_version_code }}' versionName='${{ steps.pavo-version.outputs.pavo_version }}'"
          grep -F "$EXPECTED" <<< "$BADGING"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
      - name: Name APK and calculate SHA-256
        run: |
          mkdir -p dist
          VERSION="${{ steps.pavo-version.outputs.pavo_version }}"
          cp .build/horizon-078-android/.local/android/apk/arm64-v8a/horizon-android-public.apk "dist/PavoHorizon-${VERSION}.apk"
          cd dist
          sha256sum "PavoHorizon-${VERSION}.apk" > SHA256SUMS.txt
          printf '%s\n' "Built from commit: $GITHUB_SHA" "Horizon: 68a2c4dd1b9a9e511ad3758a79ab772b6f9e5b29" "Jade API-80 adaptation: block/entity look-at providers, item frames, paintings, boats, minecarts, falling blocks, block/item displays, water/lava targeting, block-entity data, entity variants/status, access-state details, chicken egg/armadillo scute/sniffer cooldowns, RGBA red health/tool glyphs, themes, opacity, nine-position overlay anchors, named profiles, block/item ignore lists, extra reach, keybinds and commands; upstream reference 9f63f5c78c5e4938d4544c9567e06feb45649656" "Architecture: arm64-v8a" "Build: public ARM64 release; persistent PavoHorizon signing key" > BUILD-INFO.txt

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PavoHorizon-${{ steps.pavo-version.outputs.pavo_version }}-Android-arm64-v8a
          path: |
            dist/PavoHorizon-*.apk
            dist/SHA256SUMS.txt
            dist/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 14
