name: PavoHorizon Android 0.7.8 ARMv7 baseline

on:
  push:
    branches:
      - port/android-5-low-end
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pavo-horizon-078-armv7-baseline
  cancel-in-progress: true

jobs:
  armv7:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      HORIZON_REV: 68a2c4dd1b9a9e511ad3758a79ab772b6f9e5b29
      ABI: armeabi-v7a
      RUST_TARGET: armv7-linux-androideabi
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Install Android SDK and NDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)
          fi
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"

      - name: Fetch exact Horizon Android 0.7.8 source
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/starling-client/starling.git "$RUNNER_TEMP/horizon-078"
          git -C "$RUNNER_TEMP/horizon-078" checkout --detach "$HORIZON_REV"
          test "$(git -C "$RUNNER_TEMP/horizon-078" rev-parse HEAD)" = "$HORIZON_REV"

      - name: Install Rust ARMv7 target
        working-directory: ${{ runner.temp }}/horizon-078
        run: |
          rustup show
          rustup target add "$RUST_TARGET"
          rustc --version
          cargo --version

      - name: Pin Mojang manifest to the Horizon lock
        working-directory: ${{ runner.temp }}/horizon-078
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path.cwd()
          lock = json.loads((root / "research-lock.json").read_text())
          game = lock["minecraft"]
          version = game["version"]
          sha1 = game["manifest_sha1"]
          url = f"https://piston-meta.mojang.com/v1/packages/{sha1}/{version}.json"

          script = root / "tools/android_prepare.py"
          source = script.read_text()
          old = "entry = next((v for v in fetch_json(MANIFEST)['versions'] if v['id'] == version), None)"
          new = f"entry = {{'url': {url!r}, 'sha1': {sha1!r}}}"
          if source.count(old) != 1:
              raise SystemExit("Could not uniquely locate Mojang manifest lookup in android_prepare.py")
          script.write_text(source.replace(old, new))
          print(f"Using Horizon-pinned Mojang manifest: {url}")
          PY

      - name: Prepare official game tables and resources
        working-directory: ${{ runner.temp }}/horizon-078
        run: python3 tools/android_prepare.py --java-home "$JAVA_HOME"

      - name: Build original ARMv7 APK (API 27 baseline)
        working-directory: ${{ runner.temp }}/horizon-078
        run: |
          set -euo pipefail
          test -x "$JAVA_HOME_17_X64/bin/java"
          python3 tools/android_build.py \
            --abi "$ABI" \
            --public \
            --profile release \
            --sdk "$ANDROID_HOME" \
            --java-home "$JAVA_HOME_17_X64" \
            --gradle "$(command -v gradle)" \
            --ndk-version 28.2.13676358 \
            --build-tools-version 35.0.0 \
            --dev-build "android5-baseline-${GITHUB_RUN_NUMBER}" \
            --dev-version-code "$((100000 + GITHUB_RUN_NUMBER))"

          apk="$RUNNER_TEMP/horizon-078/.local/android/apk/$ABI/horizon-android-public.apk"
          test -s "$apk"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$apk" "$GITHUB_WORKSPACE/dist/PavoHorizon-0.7.8-ARMv7-API27-baseline.apk"

          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/apksigner" verify "$GITHUB_WORKSPACE/dist/PavoHorizon-0.7.8-ARMv7-API27-baseline.apk"
          "$tools/aapt" dump badging "$GITHUB_WORKSPACE/dist/PavoHorizon-0.7.8-ARMv7-API27-baseline.apk" > "$GITHUB_WORKSPACE/dist/badging.txt"
          grep -F "armeabi-v7a" "$GITHUB_WORKSPACE/dist/badging.txt"
          grep -F "sdkVersion:'27'" "$GITHUB_WORKSPACE/dist/badging.txt"

          printf 'Horizon Android 0.7.8 commit: %s\nABI: %s\nRust target: %s\nMinimum Android API: 27 (baseline only; not Android 5 compatible)\n' \
            "$HORIZON_REV" "$ABI" "$RUST_TARGET" > "$GITHUB_WORKSPACE/dist/BUILD.txt"
          sha256sum "$GITHUB_WORKSPACE/dist/PavoHorizon-0.7.8-ARMv7-API27-baseline.apk" > "$GITHUB_WORKSPACE/dist/SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: pavohorizon-078-armv7-api27-baseline
          path: dist/
          if-no-files-found: error
          retention-days: 30
