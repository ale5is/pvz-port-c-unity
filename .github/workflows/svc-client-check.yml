name: Simple Voice Chat client and Horizon 0.7.8 Android build

on:
  push:
    branches:
      - port/horizon-078-hooks-359
    paths:
      - "mod/**"
      - "patches/**"
      - ".github/workflows/svc-client-check.yml"
  pull_request:
    paths:
      - "mod/**"
      - "patches/**"
      - ".github/workflows/svc-client-check.yml"
  workflow_dispatch:

permissions:
  contents: read

# Keep Android packaging validation in sync with the native SVC audio recovery code.

concurrency:
  group: pavorizon-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install audio build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev libxfixes-dev libxext-dev
      - name: Compile the SVC client crate
        run: cargo test --manifest-path mod/simple-voice-chat/crates/svc_client/Cargo.toml --all-targets

  horizon-078-integration:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-linux-android
      - name: Checkout pinned Horizon 0.7.8 source
        run: git submodule update --init --depth 1 upstream/horizon-078
      - name: Apply Android microphone permission patch
        run: git -C upstream/horizon-078 apply "$GITHUB_WORKSPACE/patches/horizon-078/audio-permission.patch"
      - name: Route raw Simple Voice Chat custom payloads into the existing native hook
        run: git -C upstream/horizon-078 apply "$GITHUB_WORKSPACE/patches/horizon-078/voicechat-packets.patch"
      - name: Apply PavoHorizon branding and startup microphone permission
        run: python3 patches/horizon-078/pavorizon-brand.py upstream/horizon-078
      - name: Enable .hnmod import and builder; keep experimental native loader disabled
        run: python3 patches/horizon-078/native-mod-system.py upstream/horizon-078
      - name: Install Android NDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install host audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev libxfixes-dev libxext-dev
      - name: Fetch Horizon dependencies
        working-directory: upstream/horizon-078
        run: cargo fetch --locked
      - name: Build pinned horizon-mixins CLI
        run: |
          git clone https://github.com/horizon-rust/horizon-mixins.git "$RUNNER_TEMP/horizon-mixins"
          git -C "$RUNNER_TEMP/horizon-mixins" checkout a2af5c0dd4117d51ecd70066ba7a00b4a2c10dab
          cargo fetch --locked --manifest-path "$RUNNER_TEMP/horizon-mixins/Cargo.toml"
          cargo build --locked --manifest-path "$RUNNER_TEMP/horizon-mixins/Cargo.toml" -p horizon-mixins-cli
      - name: Apply the Horizon 0.7.8 SVC mixin
        run: |
          "$RUNNER_TEMP/horizon-mixins/target/debug/horizon-mixins" plan --workspace upstream/horizon-078 --mods mod --out "$RUNNER_TEMP/svc-plan.json"
          "$RUNNER_TEMP/horizon-mixins/target/debug/horizon-mixins" apply --workspace upstream/horizon-078 --mods mod --out "$RUNNER_TEMP/horizon-078-svc"
      - name: Verify native builder stays outside the frame loop
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("mod/native-mod-builder/native_mod_builder.rs").read_text()
          manifest = Path("mod/native-mod-builder/horizon-mixin.toml").read_text()
          assert "thread::Builder::new()" in source
          assert "fn on_frame" not in source
          assert 'hook = "frame"' not in manifest
          assert 'hook = "mods"' in manifest
          assert 'hook = "settings"' in manifest
          assert 'hook = "settings_click"' in manifest
          print("Native builder work is user-triggered and has no per-frame hook.")
          PY
      - name: Compile the staged Horizon Android client ARM64
        run: |
          cd "$RUNNER_TEMP/horizon-078-svc"
          python3 tools/android_build.py --check --abi arm64-v8a --ndk-version 27.2.12479018 --build-tools-version 35.0.0 --sdk "$ANDROID_HOME"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"
      - name: Pin Minecraft 26.3 metadata to Horizon's verified manifest
        working-directory: ${{ runner.temp }}/horizon-078-svc
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("tools/android_prepare.py")
          source = path.read_text()
          old = "    lab.download(entry['url'], manifest_path, entry['sha1'])"
          new = "    manifest_url = f\"https://piston-meta.mojang.com/v1/packages/{pins['manifest_sha1']}/{version}.json\"\n    lab.download(manifest_url, manifest_path, pins['manifest_sha1'])"
          if source.count(old) != 1:
              raise SystemExit("Expected unique Mojang manifest download line; refusing unsafe edit")
          path.write_text(source.replace(old, new))
          PY
      - name: Prepare public Minecraft data
        working-directory: ${{ runner.temp }}/horizon-078-svc
        run: python3 tools/android_prepare.py
      - name: Install Java 17 for Gradle and Android packaging
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Restore persistent PavoHorizon signing key or create a temporary CI key
        working-directory: ${{ runner.temp }}/horizon-078-svc
        env:
          PAVO_ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.PAVO_ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p .local/android
          if [ -n "$PAVO_ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$PAVO_ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > .local/android/debug.keystore
            chmod 600 .local/android/debug.keystore
            "$JAVA_HOME/bin/keytool" -list -keystore .local/android/debug.keystore -storepass android -alias androiddebugkey >/dev/null
            echo "PAVO_SIGNING_MODE=persistent" >> "$GITHUB_ENV"
            echo "Using the repository's persistent PavoHorizon signing key."
          else
            "$JAVA_HOME/bin/keytool" -genkeypair -v \
              -keystore .local/android/debug.keystore \
              -storetype JKS \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=PavoHorizon CI Temporary, OU=Android, O=PavoHorizon, L=Buenos Aires, ST=Buenos Aires, C=AR"
            chmod 600 .local/android/debug.keystore
            echo "PAVO_SIGNING_MODE=temporary" >> "$GITHUB_ENV"
            echo "::warning::No persistent signing secret configured. This APK is installable for testing, but future builds cannot update it in place."
          fi
      - name: Build installable Horizon 0.7.8 SVC APK
        working-directory: ${{ runner.temp }}/horizon-078-svc
        run: |
          python3 tools/android_build.py --abi arm64-v8a --ndk-version 27.2.12479018 --build-tools-version 35.0.0 --sdk "$ANDROID_HOME" --java-home "$JAVA_HOME" --gradle "$(command -v gradle)" --public --release-candidate --profile release --dev-build pavo --dev-version-code "$GITHUB_RUN_NUMBER"
          cp .local/android/apk/arm64-v8a/horizon-android-public.apk .local/android/apk/arm64-v8a/PavoHorizon.apk
          sha256sum .local/android/apk/arm64-v8a/PavoHorizon.apk > .local/android/apk/arm64-v8a/SHA256SUMS.txt
          printf 'signing_mode=%s\\n' "$PAVO_SIGNING_MODE" > .local/android/apk/arm64-v8a/SIGNING-INFO.txt
          "$JAVA_HOME/bin/keytool" -list -v -keystore .local/android/debug.keystore -storepass android -alias androiddebugkey | grep 'SHA256:' >> .local/android/apk/arm64-v8a/SIGNING-INFO.txt
      - name: Upload PavoHorizon APK
        uses: actions/upload-artifact@v4
        with:
          name: pavorizon-0.7.8-svc-arm64-apk
          path: |
            ${{ runner.temp }}/horizon-078-svc/.local/android/apk/arm64-v8a/PavoHorizon.apk
            ${{ runner.temp }}/horizon-078-svc/.local/android/apk/arm64-v8a/SHA256SUMS.txt
            ${{ runner.temp }}/horizon-078-svc/.local/android/apk/arm64-v8a/SIGNING-INFO.txt
          if-no-files-found: error
          retention-days: 14
