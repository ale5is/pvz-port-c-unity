name: Pavo GLES capability probe

on:
  push:
    branches:
      - port/android-5-low-end
    paths:
      - 'tools/gles2-probe/**'
      - '.github/workflows/pavo-gles-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pavo-gles-probe
  cancel-in-progress: true

jobs:
  build-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)
          fi
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"

      - name: Build API-22 GLES probe APK
        working-directory: tools/gles2-probe
        run: |
          set -euo pipefail
          gradle --no-daemon assembleDebug
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$apk" "$GITHUB_WORKSPACE/dist/Pavo-GLES-Capability-Probe-API22.apk"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/apksigner" verify "$GITHUB_WORKSPACE/dist/Pavo-GLES-Capability-Probe-API22.apk"
          "$tools/aapt" dump badging "$GITHUB_WORKSPACE/dist/Pavo-GLES-Capability-Probe-API22.apk" > "$GITHUB_WORKSPACE/dist/badging.txt"
          grep -F "sdkVersion:'22'" "$GITHUB_WORKSPACE/dist/badging.txt"
          printf 'Purpose: query GLES 3.x and GLES 2.x EGL contexts and report GL/EGL strings, limits and RGBA8 framebuffer support.\nThis is a hardware capability probe, not a Horizon renderer compatibility test.\n' > "$GITHUB_WORKSPACE/dist/BUILD.txt"
          sha256sum "$GITHUB_WORKSPACE/dist/Pavo-GLES-Capability-Probe-API22.apk" > "$GITHUB_WORKSPACE/dist/SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: pavo-gles-capability-probe-api22
          path: dist/
          if-no-files-found: error
          retention-days: 30
