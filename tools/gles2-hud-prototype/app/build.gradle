plugins {
    id "com.android.application"
}

android {
    namespace "dev.pavo.gles2hud"
    compileSdk 35

    defaultConfig {
        applicationId "dev.pavo.gles2hud"
        minSdk 22
        targetSdk 28
        versionCode 2
        versionName "0.2.0"
        ndk {
            abiFilters "armeabi-v7a"
        }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -Wall -Wextra"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
