[package]
name = "svc_client"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Simple Voice Chat client half for Horizon, clean-room: protocol, session, audio, and the in-game runtime."

[dependencies]
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.16"

[build-dependencies]
cc = "1.0"
