[mod]
id = "simple-voice-chat"
version = "1.0.3-pavo"
priority = 100

[compatibility]
horizon_revision = "68a2c4dd1b9a9e511ad3758a79ab772b6f9e5b29"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "simple_voice_chat"
source = "runtime.rs"

[[module]]
id = "voice_positions"
file = "crates/horizon-client/src/game.rs"
name = "voice_positions"
source = "voice_positions.rs"
visibility = "pub"

[[module]]
id = "voicechat_network"
file = "crates/horizon-client/src/game/remote.rs"
name = "voicechat_network"
source = "network.rs"

[[module]]
id = "voice_positions_remote"
file = "crates/horizon-client/src/game/remote.rs"
name = "voice_positions_remote"
source = "voice_positions_remote.rs"
visibility = "pub(crate)"

[[injection]]
id = "voicechat_payload"
kind = "HEAD"
target = "horizon_client::game::remote::Game<'_>::handle_packet"
helper = "payload.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "packet", ty = "&horizon_protocol::packets::play::Clientbound", value = "&packet" },
]

[[injection]]
id = "net_from_server"
kind = "HEAD"
hook = "net_from_server"
hook_version = 1
helper = "net.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "channel", ty = "&str", value = "channel" },
  { name = "data", ty = "&[u8]", value = "data" },
]

[[injection]]
id = "key"
kind = "HEAD"
hook = "key"
hook_version = 1
helper = "key.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "key", ty = "&str", value = "key" },
  { name = "pressed", ty = "bool", value = "pressed" },
]

[[injection]]
id = "command"
kind = "HEAD"
hook = "command"
hook_version = 1
helper = "command_hook.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]

[[injection]]
id = "frame"
kind = "HEAD"
hook = "frame"
hook_version = 1
helper = "frame.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "elapsed", ty = "std::time::Duration", value = "elapsed" },
]

[[injection]]
id = "simple_voice_chat_settings"
kind = "HEAD"
hook = "settings"
hook_version = 1
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "simple_voice_chat_settings_click"
kind = "HEAD"
hook = "settings_click"
hook_version = 1
helper = "settings_click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]

[[crate]]
id = "svc_client"
path = "crates/svc_client"
dependent = "horizon-android"

[[module]]
id = "jade_core"
file = "crates/horizon-client/src/game.rs"
name = "jade"
source = "jade.rs"
visibility = "pub"

[[injection]]
id = "jade_hud"
kind = "HEAD"
hook = "hud"
hook_version = 1
helper = "jade_hud.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
]

[[injection]]
id = "register_native_mods"
kind = "HEAD"
hook = "mods"
hook_version = 1
helper = "mods.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]
